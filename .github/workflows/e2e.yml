name: e2e

# The Mattermost bridge against a real, ephemeral Mattermost server (Testcontainers): bootstrap,
# mention routing, agent-to-agent posts, forged posts, restart and WebSocket catch-up.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mattermost:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Mattermost e2e tests
        run: bun run test:e2e
