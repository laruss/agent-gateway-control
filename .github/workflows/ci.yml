name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Biome and typecheck
        run: bun run check
      - name: Migrations match the Drizzle schema
        run: |
          bun run db:generate
          test -z "$(git status --porcelain packages/db/migrations)"
      - name: Unit tests
        run: bun run test
      - name: Integration tests (PostgreSQL via Testcontainers)
        run: bun run test:integration
