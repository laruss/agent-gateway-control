name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs it again on the tagged commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Biome and typecheck
        run: bun run check
      - name: Migrations match the Drizzle schema
        run: |
          bun run db:generate
          test -z "$(git status --porcelain packages/db/migrations)"
      - name: Unit tests
        run: bun run test
      - name: Integration tests (PostgreSQL via Testcontainers)
        run: bun run test:integration
